# Render Blueprint — NutriPath as a free Node.js web service backed by Neon PostgreSQL.
# Usage: Render Dashboard → New → Blueprint → select this repo, then enter the
# `sync: false` secrets when prompted (they are never stored in this file).
services:
  - type: web
    name: nutripath
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start          # node initDB.js && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false                  # Neon POOLED string (host has -pooler) for the app
      - key: DATABASE_URL_UNPOOLED
        sync: false                  # Neon DIRECT string, used by initDB.js for migrations
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false                  # Gmail App Password, not your login password
      - key: SESSION_SECRET
        generateValue: true          # stable across restarts — keeps users signed in
      - key: APP_TZ
        value: Asia/Kolkata
